<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - SmartSupport AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 430px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 55px;
            height: 55px;
            background: #4f46e5;
            color: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 24px;
        }

        h3 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-weight: 500;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #4338ca;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .register-link a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        <i class="bi bi-robot"></i>
    </div>

    <h3>Welcome Back</h3>

    <p class="subtitle">
        Login to SmartSupport AI
    </p>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter username"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter password"
                required>

        </div>

        <div class="text-end mb-3">
            <a href="/forgot-password" class="text-decoration-none">
                Forgot Password?
            </a>
        </div>


        <button
            type="submit"
            class="btn-login">

            <i class="bi bi-box-arrow-in-right"></i>
            Login

        </button>

    </form>


    <div class="register-link">

        Don't have an account?

        <a href="/register">
            Create Account
        </a>

    </div>

</div>

</body>

</html>
