<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - SmartSupport AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 420px;
            max-width: 92%;
            border: none;
            border-radius: 18px;
        }

        .form-control {
            border-radius: 10px;
            padding: 11px;
        }

        .btn {
            border-radius: 10px;
            padding: 11px;
        }

    </style>

</head>

<body>

<div class="container d-flex justify-content-center align-items-center"
     style="min-height:100vh;">

    <div class="card shadow p-4">

        <div class="text-center mb-4">

            <h3>Reset Password</h3>

            <p class="text-muted">
                Enter the OTP sent to your email.
            </p>

        </div>

        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    OTP
                </label>

                <input
                    type="text"
                    name="otp"
                    class="form-control"
                    maxlength="6"
                    placeholder="Enter 6-digit OTP"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    New Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter new password"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm new password"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-primary w-100">

                Reset Password

            </button>

        </form>

    </div>

</div>

</body>

</html>
