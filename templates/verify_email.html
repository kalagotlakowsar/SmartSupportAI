<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify Email - SmartSupport AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">


<style>

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #f5f7fb;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;
}

.verify-card {

    width: 420px;
    max-width: 92%;

    background: white;

    padding: 40px;

    border-radius: 20px;

    border: 1px solid #e5e7eb;

    box-shadow: 0 15px 40px rgba(0,0,0,0.08);

    text-align: center;
}

.logo {

    width: 55px;
    height: 55px;

    margin: auto;
    margin-bottom: 20px;

    background: #4f46e5;

    color: white;

    border-radius: 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;
}

h2 {

    font-size: 22px;
    font-weight: 600;

    margin-bottom: 10px;
}

.description {

    color: #6b7280;

    font-size: 13px;

    margin-bottom: 25px;
}

.email {

    color: #4f46e5;

    font-weight: 600;
}

.otp-input {

    text-align: center;

    letter-spacing: 8px;

    font-size: 22px;

    font-weight: 600;

    padding: 13px;

    border-radius: 10px;
}

.verify-btn {

    width: 100%;

    background: #4f46e5;

    color: white;

    border: none;

    padding: 12px;

    border-radius: 10px;

    font-size: 13px;

    font-weight: 500;

    margin-top: 15px;
}

.verify-btn:hover {

    background: #4338ca;
}

.back-login {

    display: block;

    margin-top: 20px;

    color: #6b7280;

    text-decoration: none;

    font-size: 12px;
}

.back-login:hover {

    color: #4f46e5;
}

</style>

</head>


<body>


<div class="verify-card">


    <div class="logo">

        <i class="bi bi-envelope-check"></i>

    </div>


    <h2>
        Verify Your Email
    </h2>


    <p class="description">

        We sent a 6-digit verification code to

        <br>

        <span class="email">
            {{ email }}
        </span>

    </p>


    <form
        method="POST"
        action="/verify-email">


        <input
            type="text"
            name="otp"
            class="form-control otp-input"
            placeholder="000000"
            maxlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            required>


        <button
            type="submit"
            class="verify-btn">

            <i class="bi bi-shield-check me-1"></i>

            Verify Email

        </button>


    </form>


    <a
        href="/login"
        class="back-login">

        <i class="bi bi-arrow-left me-1"></i>

        Back to Login

    </a>


</div>


</body>

</html>
