<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - SmartSupport AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: 'Poppins', sans-serif;

    background:
        radial-gradient(circle at top left, #e0e7ff, transparent 35%),
        radial-gradient(circle at bottom right, #ede9fe, transparent 35%),
        #f5f7fb;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 15px;
}

.register-card {
    width: 520px;
    max-width: 100%;

    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 22px;

    padding: 35px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.08);
}

.logo {
    width: 55px;
    height: 55px;

    background: #4f46e5;

    color: white;

    border-radius: 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;

    margin: 0 auto 15px;
}

.title {
    text-align: center;

    font-size: 24px;

    font-weight: 600;

    color: #111827;

    margin-bottom: 5px;
}

.subtitle {
    text-align: center;

    color: #6b7280;

    font-size: 12px;

    margin-bottom: 28px;
}

.section-title {
    font-size: 13px;

    font-weight: 600;

    color: #374151;

    margin-top: 20px;

    margin-bottom: 12px;

    display: flex;

    align-items: center;

    gap: 8px;
}

.section-title i {
    color: #4f46e5;
}

.form-label {
    font-size: 11px;

    font-weight: 500;

    color: #4b5563;
}

.form-control,
.form-select {
    font-size: 12px;

    padding: 11px 12px;

    border-radius: 10px;

    border: 1px solid #dbe1ea;
}

.form-control:focus,
.form-select:focus {
    border-color: #4f46e5;

    box-shadow:
        0 0 0 3px rgba(79,70,229,0.10);
}

.otp-section {
    display: none;

    margin-top: 10px;

    padding: 15px;

    background: #f8fafc;

    border: 1px solid #e5e7eb;

    border-radius: 12px;
}

.otp-input {
    text-align: center;

    letter-spacing: 5px;

    font-size: 16px;

    font-weight: 600;
}

.otp-btn {
    width: 100%;

    border: none;

    background: #eef2ff;

    color: #4f46e5;

    padding: 10px;

    border-radius: 9px;

    font-size: 11px;

    font-weight: 600;

    margin-top: 8px;
}

.otp-btn:hover {
    background: #e0e7ff;
}

.verify-btn {
    width: 100%;

    border: none;

    background: #4f46e5;

    color: white;

    padding: 10px;

    border-radius: 9px;

    font-size: 11px;

    font-weight: 600;

    margin-top: 8px;
}

.verify-btn:hover {
    background: #4338ca;
}

.verified {
    display: none;

    color: #15803d;

    font-size: 11px;

    font-weight: 600;

    margin-top: 8px;
}

.register-btn {
    width: 100%;

    border: none;

    background: #111827;

    color: white;

    padding: 13px;

    border-radius: 10px;

    font-size: 13px;

    font-weight: 600;

    margin-top: 25px;
}

.register-btn:hover {
    background: #1f2937;
}

.register-btn:disabled {
    background: #9ca3af;

    cursor: not-allowed;
}

.login-link {
    text-align: center;

    margin-top: 20px;

    font-size: 11px;

    color: #6b7280;
}

.login-link a {
    color: #4f46e5;

    text-decoration: none;

    font-weight: 600;
}

.note {
    font-size: 9px;

    color: #9ca3af;

    margin-top: 5px;
}

</style>

</head>


<body>


<div class="register-card">


    <!-- LOGO -->

    <div class="logo">

        <i class="bi bi-robot"></i>

    </div>


    <div class="title">

        Create Your Account

    </div>


    <div class="subtitle">

        Join SmartSupport AI and get intelligent customer support.

    </div>


    <form
        method="POST"
        action="/register"
        id="registerForm">


        <!-- BASIC INFORMATION -->

        <div class="section-title">

            <i class="bi bi-person"></i>

            Basic Information

        </div>


        <!-- USERNAME -->

        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input
                type="text"
                name="username"
                id="username"
                class="form-control"
                placeholder="Enter username"
                required>

        </div>


        <!-- ACCOUNT TYPE -->

        <div class="mb-3">

            <label class="form-label">
                Account Type
            </label>

            <select
                id="role"
                name="role"
                class="form-select"
                required>

                <option value="Customer">
                    Customer
                </option>
                <option value="Support Agent">
                    Support Agent
                </option>

            </select>

        </div>


        <!-- EMAIL -->

        <div class="section-title">

            <i class="bi bi-envelope"></i>

            Email Verification

        </div>


        <div class="mb-2">

            <label class="form-label">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                id="email"
                class="form-control"
                placeholder="Enter your email"
                required>

        </div>


        <!-- SEND OTP -->

        <button
            type="button"
            class="otp-btn"
            id="sendEmailBtn"
            onclick="sendEmailOTP()">

            <i class="bi bi-send me-1"></i>

            Send Email OTP

        </button>


        <!-- OTP -->

        <div
            class="otp-section"
            id="emailOtpSection">

            <label class="form-label">

                Enter Email OTP

            </label>

            <input
                type="text"
                id="emailOtp"
                class="form-control otp-input"
                placeholder="000000"
                maxlength="6"
                inputmode="numeric">

            <button
                type="button"
                class="verify-btn"
                id="verifyEmailBtn"
                onclick="verifyEmailOTP()">

                <i class="bi bi-shield-check me-1"></i>

                Verify Email

            </button>

            <div
                class="verified"
                id="emailVerified">

                <i class="bi bi-check-circle-fill"></i>

                Email Verified

            </div>

        </div>


        <!-- CONTACT INFORMATION -->

        <div class="section-title">

            <i class="bi bi-phone"></i>

            Contact Information

        </div>


        <div class="mb-3">

            <label class="form-label">

                Phone Number

            </label>

            <input
                type="tel"
                name="phone"
                id="phone"
                class="form-control"
                placeholder="Enter phone number"
                required>

            <div class="note">

                Your phone number is used for account contact information.

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="section-title">

            <i class="bi bi-lock"></i>

            Security

        </div>


        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                id="password"
                class="form-control"
                placeholder="Create password"
                required>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="mb-3">

            <label class="form-label">
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                id="confirmPassword"
                class="form-control"
                placeholder="Confirm password"
                required>

        </div>


        <!-- CREATE ACCOUNT -->

        <button
            type="submit"
            class="register-btn"
            id="registerBtn"
            disabled>

            <i class="bi bi-person-plus me-1"></i>

            Create Account

        </button>


    </form>


    <div class="login-link">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </div>


</div>


<script>


let emailVerified = false;


/* ========================================
   SEND EMAIL OTP
======================================== */

function sendEmailOTP() {

    const username =
        document.getElementById("username")
        .value
        .trim();

    const email =
        document.getElementById("email")
        .value
        .trim();

    const phone =
        document.getElementById("phone")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;


    if (!username) {

        alert("Please enter your username.");

        return;
    }


    if (!email) {

        alert("Please enter your email address.");

        return;
    }


    if (!phone) {

        alert("Please enter your phone number.");

        return;
    }


    if (!password) {

        alert("Please enter your password.");

        return;
    }


    const confirmPassword =
        document.getElementById("confirmPassword")
        .value;


    if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return;
    }


    const sendButton =
        document.getElementById(
            "sendEmailBtn"
        );


    sendButton.disabled = true;

    sendButton.innerHTML =
        '<i class="bi bi-hourglass-split me-1"></i> Sending...';


    const formData = new URLSearchParams();

    formData.append(
        "username",
        username
    );

    formData.append(
        "email",
        email
    );

    formData.append(
        "phone",
        phone
    );

    formData.append(
        "password",
        password
    );
    const role =
    document.getElementById("role").value;

    formData.append(
        "role",
        role
    );


    fetch(
        "/send-email-otp",
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded"
            },

            body: formData.toString()
        }
    )

    .then(response =>
        response.json()
    )

    .then(data => {

        sendButton.disabled = false;

        sendButton.innerHTML =
            '<i class="bi bi-send me-1"></i> Send Email OTP';


        if (data.success) {

            document.getElementById(
                "emailOtpSection"
            ).style.display = "block";


            alert(
                "OTP sent successfully. Check your email."
            );

        } else {

            alert(
                data.message
            );

        }

    })

    .catch(error => {

        console.error(error);

        sendButton.disabled = false;

        sendButton.innerHTML =
            '<i class="bi bi-send me-1"></i> Send Email OTP';

        alert(
            "Unable to connect to the server."
        );

    });

}


/* ========================================
   VERIFY EMAIL OTP
======================================== */

function verifyEmailOTP() {

    const otp =
        document.getElementById(
            "emailOtp"
        )
        .value
        .trim();


    if (otp.length !== 6) {

        alert(
            "Please enter the 6-digit OTP."
        );

        return;
    }


    const verifyButton =
        document.getElementById(
            "verifyEmailBtn"
        );


    verifyButton.disabled = true;

    verifyButton.innerHTML =
        '<i class="bi bi-hourglass-split me-1"></i> Verifying...';


    fetch(
        "/verify-email",
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded"
            },

            body:
                "otp=" +
                encodeURIComponent(otp)
        }
    )

    .then(response =>
        response.json()
    )

    .then(data => {

        verifyButton.disabled = false;

        verifyButton.innerHTML =
            '<i class="bi bi-shield-check me-1"></i> Verify Email';


        if (data.success) {

            emailVerified = true;


            document.getElementById(
                "emailVerified"
            ).style.display = "block";


            document.getElementById(
                "verifyEmailBtn"
            ).style.display = "none";


            document.getElementById(
                "sendEmailBtn"
            ).disabled = true;


            document.getElementById(
                "registerBtn"
            ).disabled = false;


            alert(
                "Email verified successfully!"
            );


            // Account is already created
            // by verify-email

            setTimeout(
                function() {

                    window.location.href =
                        "/login";

                },
                1000
            );


        } else {

            alert(
                data.message
            );

        }

    })

    .catch(error => {

        console.error(error);

        verifyButton.disabled = false;

        verifyButton.innerHTML =
            '<i class="bi bi-shield-check me-1"></i> Verify Email';

        alert(
            "Failed to verify OTP. Please try again."
        );

    });

}


/* ========================================
   PASSWORD CHECK
======================================== */

document.getElementById(
    "registerForm"
).addEventListener(
    "submit",
    function(event) {

        const password =
            document.getElementById(
                "password"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        if (
            password !== confirmPassword
        ) {

            event.preventDefault();

            alert(
                "Passwords do not match."
            );

            return;
        }


        if (!emailVerified) {

            event.preventDefault();

            alert(
                "Please verify your email first."
            );

        }

    }
);

</script>



</body>

</html>
