<!DOCTYPE html>
<html>
<head>

    <title>Edit User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h3>Edit User Role</h3>

            <hr>

            <p>
                <strong>User:</strong>
                {{ user[1] }}
            </p>

            <form method="POST">

                <label class="form-label">
                    Role
                </label>

                <select name="role"
                        class="form-select">

                    <option value="Admin"
                        {% if user[2] == "Admin" %}selected{% endif %}>
                        Admin
                    </option>

                    <option value="Support Agent"
                        {% if user[2] == "Support Agent" %}selected{% endif %}>
                        Support Agent
                    </option>

                    <option value="Customer"
                        {% if user[2] == "Customer" %}selected{% endif %}>
                        Customer
                    </option>

                </select>

                <br>

                <button class="btn btn-primary">
                    Update Role
                </button>

                <a href="/users"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
